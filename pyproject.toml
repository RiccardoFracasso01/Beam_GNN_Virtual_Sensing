requires-python = ">=3.10"
dependencies = [
    "captum>=0.9.0",
    "fastdtw>=0.3.4",
    "fastparquet>=2025.12.0",
    "ipykernel>=7.2.0",
    "keyring>=25.7.0",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "networkx>=3.0",
    "numpy>=2.2.6",
    "openseespy>=3.5.1.3",
    "optuna>=4.7.0",
    "pandas>=2.3.3",
    "plotly>=6.5.2",
    "pyarrow>=23.0.1",
    "pyoma-2>=1.2.3",
    "python-ternary>=1.0.8",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "torch-geometric>=2.7.0",
    "tqdm>=4.67.3",
    "vfo>=0.0.19",
